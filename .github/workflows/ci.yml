name: AgentRelay CI Pipeline

on:
  push:
    branches: [main, master, handoff-inbox-implementation]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Test & Verify Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            cli/package.json

      - name: Install Backend dependencies
        run: npm ci --prefix backend

      - name: Run Backend Unit & Integration Tests (TEST-013, 014, 015, 016, 018)
        run: npm test --prefix backend

      - name: Install CLI dependencies
        run: npm ci --prefix cli

      - name: Run CLI Unit Tests
        run: npm test --prefix cli

      - name: Run CLI E2E Smoke Tests
        run: node cli/test/e2e-smoke.js

      - name: Run Scrubber Recall Evaluation (Metric M-1, TEST-005)
        run: node eval/benchmark_scrubber.js
